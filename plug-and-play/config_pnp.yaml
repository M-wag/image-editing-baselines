# general
seed: 1
device: 'cuda'
output_path: 'out'

# data
image_path: 'car.jpg'
latents_path: 'latents_forward'

# diffusion
sd_version: '1.5'
guidance_scale: 7.5
n_timesteps: 50
prompt: a red car
negative_prompt: ugly, blurry, black, low res, unrealistic

# pnp injection thresholds, ∈ [0, 1]
pnp_attn_t: 0.5
pnp_f_t: 0.8
